# Dogfood: Cilytics for the flisk-sh org, published to GitHub Pages from the cilytics-data branch
# (https://cilytics.flisk.si/). Uses the action from this checkout, so a PR here is tested before it ships.
name: Cilytics (flisk-sh)
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cilytics
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the cilytics-data branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.5
      - name: Check out Flisk for its scoreboard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: flisk-sh/flisk
          path: flisk
          persist-credentials: false
      - name: Check out GEL for the five-second test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: flisk-sh/gel
          ref: 2f24a26f57b0e1d2b0143ed19cb83aab118af92e
          path: gel
          persist-credentials: false
      - name: Websites in the flisk.si catalog
        run: curl -fsS https://raw.githubusercontent.com/flisk-sh/flisk.si/main/_data/catalog.yml | grep -oE '^ +url: https?://[^ ]+' | sed -E 's/^ +url: //' | grep -vE 'github.com|/mcp$' | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.stringify([...new Set(s.split("\n").filter(Boolean))])))' > sites.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
        working-directory: flisk/cli
      - name: Flisk scoreboard
        run: node flisk/scripts/scores/run.mjs --root flisk --json > scores.json
      - name: Ranker's repos, scored a window at a time
        run: curl -fsS https://ranker.flisk.si/api/repos | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.stringify(JSON.parse(s).map(r=>r.repo))))' > ranked.json || echo '[]' > ranked.json
      - uses: ./
        with:
          ranked-file: ranked.json
          sites-file: sites.json
          gel-dir: gel
          org: flisk-sh
          cname: cilytics.flisk.si
          scores-file: scores.json
          scores-repo: flisk-sh/flisk
          scores-url: https://github.com/flisk-sh/flisk/blob/main/scripts/scores/{id}.mjs
      - name: GEL to Cilytics end-to-end (planted findings in flisk-sh/gel-e2e)
        run: node scripts/e2e-gel.mjs cilytics-out/data.json gel-e2e

  # The published page answers before the run counts as green.
  health:
    needs: collect
    uses: flisk-sh/.github/.github/workflows/deploy-health.yml@b5eeea945364038cd2143e9676b77fc9af293dfa # v1.4.0
    permissions:
      contents: read
    with:
      url: https://cilytics.flisk.si/
      expect_text: Cilytics
